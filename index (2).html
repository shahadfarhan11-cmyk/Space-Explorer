<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04030c;--panel:#12102a;--line:#3a3478;--tx:#eceaff;--mut:#a9a4d6;--acc:#7c6cff;--gold:#ffc857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','Fredoka',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
h1{font-size:1.25rem;margin:0;font-weight:600}
button{font:inherit;color:var(--tx);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;pointer-events:auto}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}
#hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--mut);font-size:.9rem;pointer-events:none}
#panel,#quiz{position:fixed;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;max-width:380px;width:calc(100% - 24px);max-height:70%;overflow:auto;display:none}
#panel{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#quiz{left:50%;top:50%;transform:translate(-50%,-50%);max-width:440px}
#panel h2,#quiz h2{margin:0 0 2px;font-size:1.5rem}
.t{color:var(--gold);margin:0 0 10px}
ul{padding-left:20px;margin:6px 0;line-height:1.5}
.dyk{background:#1c1840;border-radius:12px;padding:10px 12px;margin-top:10px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:14px}
.ok{border-color:#4ade80}.no{border-color:#f87171}
.x{float:inline-end;padding:2px 10px}
.stars{font-size:2rem;color:var(--gold)}
@media (max-width:560px){#panel{left:12px;max-width:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body>
<canvas id="c" aria-label="3D solar system"></canvas>
<header><h1 id="ti"></h1><span><button id="lg"></button> <button id="qb"></button></span></header>
<div id="hint"></div>
<section id="panel" aria-live="polite"></section>
<section id="quiz"></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D=[
["Sun",0xffb627,5,0,0,"The Heart of Our Solar System",["A star at the center of the solar system","Holds more than 99% of the system's mass","Gives light and heat to every planet"],"Light from the Sun reaches Earth in about 8 minutes. Over a million Earths could fit inside it."],
["Mercury",0xa8a39d,.7,9,4.1,"The Closest Planet to the Sun",["First planet from the Sun and the smallest","No moons; rocky and covered in craters","One year lasts only 88 Earth days"],"Days reach 430°C and nights drop below -180°C."],
["Venus",0xe8c07a,1.2,13,3,"The Hottest Planet",["Second planet, similar in size to Earth","Covered in thick clouds, no moons","Spins backwards, and a day is longer than its year"],"Venus is hotter than Mercury even though it is farther from the Sun (465°C)."],
["Earth",0x3b82f6,1.3,18,2.5,"Our Home Planet",["Third planet, the only one known with life","71% of the surface is water","One natural moon"],"Earth zooms around the Sun at nearly 107,000 km/h."],
["Mars",0xd1552f,.9,23,2,"The Red Planet",["Fourth planet, a target for future human exploration","Has two moons","Home to the largest volcano in the solar system"],"Evidence suggests water once flowed on Mars."],
["Jupiter",0xd9a066,3,32,1.1,"The Giant Planet",["Largest planet, a gas giant of hydrogen and helium","Has the Great Red Spot storm","Strong magnetic field and many moons"],"More than 1,300 Earths could fit inside Jupiter."],
["Saturn",0xe3cd8a,2.5,42,.8,"The Ringed Planet",["Sixth planet, famous for its icy rings","Hundreds of moons have been confirmed","One of the least dense planets"],"Saturn is so light it could float in a giant ocean."],
["Uranus",0x7fdbe0,1.8,51,.55,"The Sideways Planet",["Seventh planet, an ice giant","Rotates on its side","Blue-green from methane gas"],"A season on Uranus lasts more than 20 Earth years."],
["Neptune",0x4062e8,1.7,59,.4,"The Windy Planet",["Eighth and farthest planet","Strongest winds in the solar system","One orbit takes 165 Earth years"],"Winds on Neptune can exceed 2,000 km/h."]];
const Q=[["Which planet is closest to the Sun?",["Mercury","Earth","Mars"],0],["Which planet is called the Red Planet?",["Venus","Mars","Jupiter"],1],["Which planet has the famous rings?",["Saturn","Uranus","Neptune"],0],["Which is the largest planet?",["Earth","Jupiter","Mars"],1],["What is the name of our galaxy?",["Andromeda","Milky Way","Sombrero"],1]];
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(55,1,.1,1000);
let th=.6,ph=1.1,rad=85;
function cam(){C.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));C.lookAt(0,0,0)}
function size(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',size);size();cam();
S.add(new THREE.AmbientLight(0x404070,.7));
const sl=new THREE.PointLight(0xfff0d0,2.2,400);S.add(sl);
const sp=[];for(let i=0;i<1800;i++){const v=new THREE.Vector3().randomDirection?0:0;const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),r=300+Math.random()*100;sp.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfc8ff,size:1.2,sizeAttenuation:false}));S.add(stars);
const bodies=[];
D.forEach((d,i)=>{
 const m=new THREE.Mesh(new THREE.SphereGeometry(d[2],32,32),i?new THREE.MeshStandardMaterial({color:d[1],roughness:.9}):new THREE.MeshBasicMaterial({color:d[1]}));
 const piv=new THREE.Object3D();S.add(piv);m.position.x=d[3];piv.add(m);m.userData.i=i;
 piv.rotation.y=Math.random()*6;
 if(i){const o=new THREE.Mesh(new THREE.RingGeometry(d[3]-.05,d[3]+.05,128),new THREE.MeshBasicMaterial({color:0x4a42a0,side:2,transparent:true,opacity:.5}));o.rotation.x=-Math.PI/2;S.add(o)}
 if(d[0]=="Saturn"){const r=new THREE.Mesh(new THREE.RingGeometry(3.4,5.4,64),new THREE.MeshBasicMaterial({color:0xcdb88a,side:2,transparent:true,opacity:.8}));r.rotation.x=-Math.PI/2.4;m.add(r)}
 if(d[0]=="Earth"){const mp=new THREE.Object3D();m.add(mp);const mo=new THREE.Mesh(new THREE.SphereGeometry(.35,16,16),new THREE.MeshStandardMaterial({color:0xbbbbbb}));mo.position.x=2.3;mp.add(mo);m.userData.moon=mp}
 bodies.push({m,piv,sp:d[4]*.12});
});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
let drag=false,moved=0,lx=0,ly=0,sel=null;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;th-=dx*.005;ph=Math.max(.2,Math.min(2.9,ph-dy*.005));cam()});
cv.addEventListener('pointerup',e=>{drag=false;if(moved<6)pick(e)});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(15,Math.min(160,rad+e.deltaY*.05));cam()},{passive:false});
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,C);
 const h=ray.intersectObjects(bodies.map(b=>b.m),false)[0];if(h)show(h.object.userData.i)}
const P=document.getElementById('panel'),Qz=document.getElementById('quiz');
const A=[
["الشمس","قلب نظامنا الشمسي",["نجم يقع في مركز النظام الشمسي","تحتوي على أكثر من 99% من كتلة النظام الشمسي","تمنح الضوء والحرارة لجميع الكواكب"],"يصل ضوء الشمس إلى الأرض في نحو 8 دقائق، ويتسع داخلها أكثر من مليون كرة أرضية."],
["عطارد","أقرب كوكب إلى الشمس",["الكوكب الأول وأصغر الكواكب","بلا أقمار، وسطحه صخري مليء بالحفر","السنة فيه 88 يومًا أرضيًا فقط"],"تصل حرارة النهار إلى 430°م وتنخفض ليلًا تحت -180°م."],
["الزهرة","أشد الكواكب حرارة",["الكوكب الثاني ويشبه الأرض في الحجم","تغطيه سحب كثيفة وليس له أقمار","يدور عكس اتجاه معظم الكواكب، ويومه أطول من سنته"],"الزهرة أسخن من عطارد (465°م) رغم أنها أبعد عن الشمس."],
["الأرض","كوكبنا الأم",["الكوكب الثالث والوحيد المعروف بوجود الحياة","71% من سطحه مغطى بالماء","له قمر طبيعي واحد"],"تدور الأرض حول الشمس بسرعة تقارب 107,000 كم/ساعة."],
["المريخ","الكوكب الأحمر",["الكوكب الرابع وهدف الاستكشاف البشري مستقبلًا","له قمران","فيه أكبر بركان في النظام الشمسي"],"تشير الأدلة إلى أن الماء جرى على سطح المريخ قديمًا."],
["المشتري","الكوكب العملاق",["أكبر الكواكب، عملاق غازي من الهيدروجين والهيليوم","فيه عاصفة البقعة الحمراء العظيمة","مجال مغناطيسي قوي وأقمار كثيرة"],"يتسع المشتري لأكثر من 1,300 كرة أرضية."],
["زحل","الكوكب ذو الحلقات",["الكوكب السادس ويشتهر بحلقاته من الجليد والصخور","تأكدت مئات الأقمار حوله","من أقل الكواكب كثافة"],"زحل خفيف لدرجة أنه قد يطفو في محيط ضخم."],
["أورانوس","الكوكب الجانبي",["الكوكب السابع، عملاق جليدي","يدور على جانبه","لونه أزرق مخضر بسبب غاز الميثان"],"قد يستمر الفصل على أورانوس أكثر من 20 سنة أرضية."],
["نبتون","الكوكب العاصف",["الكوكب الثامن وأبعد الكواكب","أقوى الرياح في النظام الشمسي","دورته حول الشمس تستغرق 165 سنة أرضية"],"قد تتجاوز سرعة الرياح على نبتون 2,000 كم/ساعة."]];
const QA=[["أي كوكب هو الأقرب إلى الشمس؟",["عطارد","الأرض","المريخ"],0],["أي كوكب يُسمى الكوكب الأحمر؟",["الزهرة","المريخ","المشتري"],1],["أي كوكب له الحلقات الشهيرة؟",["زحل","أورانوس","نبتون"],0],["ما أكبر كوكب؟",["الأرض","المشتري","المريخ"],1],["ما اسم مجرتنا؟",["أندروميدا","درب التبانة","سومبريرو"],1]];
const T={ar:{ti:"مستكشف الفضاء",qb:"ابدأ الاختبار",lg:"English",hint:"اسحب للتحرك، قرّب بالعجلة، واضغط على كوكب لتتعرف عليه",dyk:"هل تعلم؟",q:"السؤال",of:"من",cg:"تهانينا يا مستكشف الفضاء!",sc:"نتيجتك",bd:"حصلت على شارة: سيد المجرة.",rb:"أعد المحاولة لتحصل على شارة سيد المجرة.",end:"واصل التعلم والاكتشاف، ولا تتوقف أبدًا عن الوصول إلى النجوم.",rt:"حاول مرة أخرى",cl:"العودة إلى الفضاء",x:"إغلاق"},
en:{ti:"Space Explorer",qb:"Start quiz",lg:"العربية",hint:"Drag to look around, scroll to zoom, tap a planet to learn about it",dyk:"Did you know?",q:"Question",of:"of",cg:"Congratulations, Space Explorer!",sc:"You scored",bd:"Badge unlocked: Galaxy Master.",rb:"Retry to earn the Galaxy Master badge.",end:"Keep learning, keep discovering, and never stop reaching for the stars.",rt:"Try again",cl:"Back to space",x:"Close"}};
let lang='ar',qi=0,sc=0;
const QQ=()=>lang=='ar'?QA:Q;
function show(i){sel=i;const d=D[i],a=A[i],ar=lang=='ar',t=T[lang];P.style.display='block';Qz.style.display='none';
 P.innerHTML=`<button class="x" aria-label="${t.x}" onclick="P.style.display='none';sel=null">×</button><h2>${ar?a[0]:d[0]}</h2><p class="t">${ar?a[1]:d[5]}</p><ul>${(ar?a[2]:d[6]).map(x=>`<li>${x}</li>`).join('')}</ul><div class="dyk"><b>${t.dyk}</b> ${ar?a[3]:d[7]}</div>`}
document.getElementById('qb').onclick=()=>{qi=0;sc=0;P.style.display='none';Qz.style.display='block';ask()};
function ask(){const Z=QQ(),t=T[lang];if(qi>=Z.length)return end();const q=Z[qi];
 Qz.innerHTML=`<h2>${t.q} ${qi+1} ${t.of} ${Z.length}</h2><p>${q[0]}</p>`+q[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('');
 Qz.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;Qz.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  Qz.querySelector(`[data-k="${q[2]}"]`).classList.add('ok');if(k==q[2])sc++;else b.classList.add('no');qi++;setTimeout(ask,900)})}
function end(){const n=QQ().length,t=T[lang],s=Math.round(sc/n*3);
 Qz.innerHTML=`<h2>${t.cg}</h2><div class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><p>${t.sc}: ${sc} ${t.of} ${n}. ${sc==n?t.bd:t.rb}</p><p>${t.end}</p><button id="rt">${t.rt}</button> <button id="cl">${t.cl}</button>`;
 document.getElementById('rt').onclick=()=>{qi=0;sc=0;ask()};document.getElementById('cl').onclick=()=>Qz.style.display='none'}
function setLang(l){lang=l;const t=T[l];document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';
 ti.textContent=t.ti;qb.textContent=t.qb;lg.textContent=t.lg;hint.textContent=t.hint;document.title=t.ti;Qz.style.display='none';if(sel!=null)show(sel)}
lg.onclick=()=>setLang(lang=='ar'?'en':'ar');setLang('ar');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){requestAnimationFrame(loop);if(!reduce){bodies.forEach(b=>{b.piv.rotation.y+=b.sp*.01;b.m.rotation.y+=.01;if(b.m.userData.moon)b.m.userData.moon.rotation.y+=.04});stars.rotation.y+=.0001}R.render(S,C)}
loop();
</script></body></html>
